services:
  - type: web
    name: khandwa-tikkad-hotel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: STAFF_ACCESS_CODE
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/hotel.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
