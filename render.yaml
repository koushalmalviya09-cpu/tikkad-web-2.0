services:
  - type: web
    name: khandwa-tikkad-hotel
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: STAFF_ACCESS_CODE
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/hotel.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
    disk:
      name: hotel-data
      mountPath: /var/data
      sizeGB: 1
